services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: munin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: munin
      POSTGRES_PASSWORD: munin
      POSTGRES_DB: munin
    ports:
      - "5433:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munin -d munin"]
      interval: 5s
      timeout: 3s
      retries: 10

  llama-embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: munin-llama-embed
    restart: unless-stopped
    # M5: depends_on postgres so model load does not race a cold Postgres start.
    # munin host process should wait for both llama-embed and llama-rerank to be
    # healthy before first recall() call (check with: podman compose ps).
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      --model /models/embeddinggemma-300M-Q8_0.gguf
      --embedding
      --pooling mean
      --host 0.0.0.0
      --port 8080
      --ctx-size 2048
      --batch-size 2048
      --ubatch-size 2048
    ports:
      - "8088:8080"
    volumes:
      - ./models:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  llama-rerank:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: munin-llama-rerank
    restart: unless-stopped
    # M5: depends_on postgres (same rationale as llama-embed).  The reranker does
    # not query Postgres directly but shares the same cold-start window; keeping
    # all three services in sync avoids spurious "reranker unavailable" warnings
    # on first recall() call after `podman compose up -d`.
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      --model /models/bge-reranker-v2-m3-Q8_0.gguf
      --reranking
      --host 0.0.0.0
      --port 8080
    ports:
      - "8089:8080"
    volumes:
      - ./models:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
